name: Build Hub

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm hub creation under NOTION_PARENT_ID'
        required: true
        default: 'no'

jobs:
  build:
    if: ${{ github.event.inputs.confirm == 'yes' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Build Script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_ID: ${{ secrets.NOTION_PARENT_ID }}
        run: npx tsx scripts/build.ts

      - name: Upload Generated IDs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notion-ids
          path: out/ids.json
